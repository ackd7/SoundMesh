name: Build & Release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v", "V")
          } else {
            $line = Select-String -Path build.gradle.kts -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
            $v = $line.Matches[0].Groups[1].Value
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building SoundMesh version: $v"

      - name: Compile, Test & Create App Bundle
        run: .\gradlew.bat check createDistributable --no-daemon --console=plain

      - name: Ensure NSIS is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") -and -not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y
          }

      - name: Build NSIS Setup & Single-EXE Portable
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\build-nsis.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SoundMesh-${{ steps.ver.outputs.version }}-Windows
          path: |
            build/SoundMesh-${{ steps.ver.outputs.version }}-Setup.exe
            build/SoundMesh-${{ steps.ver.outputs.version }}-Portable.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SoundMesh ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/SoundMesh-${{ steps.ver.outputs.version }}-Setup.exe
            build/SoundMesh-${{ steps.ver.outputs.version }}-Portable.exe
